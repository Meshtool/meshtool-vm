# Meshtool VM — an agent's workspace with one way out.
#
#   sandbox ──(inside: no route out)──> gate ──(outside)──> allowlisted hosts
#
# The sandbox is on an `internal` network in `isolated` gateway mode: there is
# no route to the internet, and the host has no address on that network either,
# so a tool that ignores the proxy settings has nowhere to go — not even to a
# service listening on the host. The gate is the only container on both
# networks, and it decides and receipts every connection.
#
# Needs Docker Engine 28 or newer (for the isolated gateway mode).
name: meshtool-vm

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  # A real PID 1 that reaps orphans; without it, every finished background
  # process stays a zombie and the pids limit fills up over a long session.
  init: true

services:
  gate:
    <<: *hardened
    build: ./gate
    environment:
      POLICY_FILE: /policy/allow.txt
      RECEIPTS_FILE: /receipts/egress.jsonl
      UPSTREAM_PROXY: ${UPSTREAM_PROXY:-}
    volumes:
      - ./policy:/policy:ro
      - ./receipts:/receipts
    networks: [inside, outside]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  sandbox:
    <<: *hardened
    build: ./sandbox
    depends_on:
      gate: { condition: service_healthy }
    environment:
      HTTPS_PROXY: http://gate:3128
      HTTP_PROXY: http://gate:3128
      https_proxy: http://gate:3128
      http_proxy: http://gate:3128
      NO_PROXY: ""
      NODE_USE_ENV_PROXY: "1"
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/node:size=256m,uid=1000,gid=1000
    volumes:
      - ./work:/work
    networks: [inside]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

networks:
  inside:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  outside: {}
